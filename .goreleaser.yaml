version: 2
project_name: ocapps

before:
  hooks:
    - go mod tidy

builds:
  - id: ocapps
    main: ./cmd/ocapps
    binary: ocapps
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: ocapps
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true
