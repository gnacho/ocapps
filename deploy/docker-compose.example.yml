# ocapps as one more service of the OpenCloud Docker Compose project.
#
# It is NOT a separate project: it overlays the OpenCloud compose file so the
# two containers share a network and ocapps resolves "opencloud" through DNS.
#
#   docker build -t ocapps https://github.com/gnacho/ocapps.git
#   docker compose -f docker-compose.yml -f docker-compose.ocapps.yml up -d
#
# Web extensions, proxy routes and verification: deploy/README.md, section
# "Docker Compose deployment".
services:
  ocapps:
    image: ocapps
    restart: unless-stopped
    depends_on:
      - opencloud
    environment:
      # The OpenCloud API listens on port 9200 inside its container, so there is
      # no need to publish that port for ocapps to reach it.
      OCAPPS_OPENCLOUD_URL: http://opencloud:9200
      # Turn off the modules you are not going to use: less configuration and
      # less surface. Photos additionally needs an OpenCloud app token.
      OCAPPS_NEWS_ENABLED: "false"
      OCAPPS_PHOTOS_ENABLED: "false"
    volumes:
      - ocapps-data:/var/lib/ocapps
    ports:
      # Only the host proxy needs it. Do not expose it to the Internet.
      - "127.0.0.1:8096:8096"
    networks:
      - opencloud-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ocapps-data:

networks:
  opencloud-net:
