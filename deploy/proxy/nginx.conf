# Snippet nginx para el proxy delante de ocapps (SPEC §9.3).
# Incluir dentro del `server {}` que sirve la instancia OpenCloud
# (mismo origen que la web, para que las extensiones llamen same-origin).
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠  EL CAMBIO DE PROXY DE ESTA MIGRACIÓN: /ocphotos-api/ SIN STRIP
#
# Antes, ocphotos recibía la ruta strip-peada
# (`proxy_pass http://127.0.0.1:8097/;` con trailing slash → photos veía
# `/api/...`). En el binario unificado `/api/` pertenece a news
# (`/api/me`, `/api/users`), así que photos registra sus rutas como
# `/ocphotos-api/api/...` y el proxy debe pasar el prefijo INTACTO:
# `proxy_pass http://127.0.0.1:8096;` SIN trailing slash.
# Cero cambios en frontends: la extensión ya llama `/ocphotos-api/api/...`.
# ═══════════════════════════════════════════════════════════════════════
#
# Estado ANTERIOR (referencia): /index.php/apps/news/* y /api/* → ocnews
# :8094; /index.php/apps/notes/* y /ocs/* → ocnotes :8100; /ocphotos-api/
# → ocphotos :8097 con strip. Objetivo: TODO al mismo upstream, sin strip.

# Upstream único del servicio unificado (un solo listener, SPEC §3.2).
upstream ocapps {
    server 127.0.0.1:8096;
    keepalive 32;
}

# news: contrato News API v1.3 (clientes Nextcloud News / news-android).
# Igual que hoy (sin strip): solo cambia el upstream.
location /index.php/apps/news/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Las credenciales viajan en Authorization (Basic/Bearer): preservarla.
    proxy_pass_request_headers on;
}

# notes: contrato Notes API (web OpenCloud / Iotas). Igual que hoy, sin strip.
location /index.php/apps/notes/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
}

# OCS (capabilities + cloud/user): lo sirve el módulo notes (SPEC §4.2).
location /ocs/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
}

# news API propia: la extensión llama /api/me/* a la RAÍZ del host
# (SPEC §4.1). Patrones exactos: NO enrutar un catch-all /api/ — chocaría
# con cualquier otro /api/ del host.
location = /api/me            { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location /api/me/             { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location = /api/users         { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location /api/users/          { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }

# photos: /ocphotos-api/ SIN STRIP (ver aviso destacado arriba).
# `proxy_pass http://ocapps;` sin URI ni trailing slash = la ruta llega
# intacta (/ocphotos-api/api/...) al backend.
location /ocphotos-api/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    # Originales y thumbs pueden ser grandes.
    client_max_body_size 64m;
}

# Streaming de vídeo firmado: Range requests y sesiones largas
# (igual que hoy en el proxy viejo de ocphotos).
location /ocphotos-api/api/video/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # No bufferizar: streaming directo al cliente.
    proxy_buffering off;
    proxy_request_buffering off;
}
