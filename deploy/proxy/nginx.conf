# nginx snippet for the proxy in front of ocapps (SPEC §9.3).
# Include it inside the `server {}` that serves the OpenCloud instance
# (same origin as the web app, so the extensions call same-origin).
#
# ═══════════════════════════════════════════════════════════════════════
# ⚠  THE PROXY CHANGE OF THIS MIGRATION: /ocphotos-api/ WITHOUT STRIP
#
# Before, ocphotos received the stripped path
# (`proxy_pass http://127.0.0.1:8097/;` with a trailing slash, so photos
# saw `/api/...`). In the unified binary `/api/` belongs to news
# (`/api/me`, `/api/users`), so photos registers its routes as
# `/ocphotos-api/api/...` and the proxy must pass the prefix INTACT:
# `proxy_pass http://127.0.0.1:8077;` with NO trailing slash.
# Zero frontend changes: the extension already calls `/ocphotos-api/api/...`.
# ═══════════════════════════════════════════════════════════════════════
#
# PREVIOUS state (reference): /index.php/apps/news/* and /api/* -> ocnews
# :8094, /index.php/apps/notes/* and /ocs/* -> ocnotes :8100, and
# /ocphotos-api/ -> ocphotos :8097 with strip. Goal: EVERYTHING to the same
# upstream, without strip.

# Single upstream of the unified service (a single listener, SPEC §3.2).
upstream ocapps {
    server 127.0.0.1:8077;
    keepalive 32;
}

# news: News API v1.3 contract (Nextcloud News / news-android clients).
# Same as today (no strip), only the upstream changes.
location /index.php/apps/news/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Credentials travel in Authorization (Basic/Bearer), so preserve it.
    proxy_pass_request_headers on;
}

# notes: Notes API contract (OpenCloud web / Iotas). Same as today, no strip.
location /index.php/apps/notes/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
}

# OCS (capabilities + cloud/user): served by the notes module (SPEC §4.2).
location /ocs/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
}

# news' own API: the extension calls /api/me/* at the host ROOT
# (SPEC §4.1). Exact patterns: do NOT route a /api/ catch-all, as it would
# clash with any other /api/ on the host.
location = /api/me            { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location /api/me/             { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location = /api/users         { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }
location /api/users/          { proxy_pass http://ocapps; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass_request_headers on; }

# photos: /ocphotos-api/ WITHOUT STRIP (see the warning at the top).
# `proxy_pass http://ocapps;` with no URI and no trailing slash means the path
# arrives intact (/ocphotos-api/api/...) at the backend.
location /ocphotos-api/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    # Originals and thumbs can be large.
    client_max_body_size 64m;
}

# Signed video streaming: Range requests and long sessions
# (same as the old ocphotos proxy does today).
location /ocphotos-api/api/video/ {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # No buffering: stream straight to the client.
    proxy_buffering off;
    proxy_request_buffering off;
}

# Per-owner change notice channel (SSE): the extension stops polling.
# NOTE: without `proxy_buffering off` the events sit in the nginx buffer and
# the client sees nothing until it fills up. The 25 s heartbeat keeps the
# connection alive, so proxy_read_timeout would not need touching, but it is
# raised anyway for intermediate proxies.
location /ocphotos-api/api/stream {
    proxy_pass http://ocapps;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
