# Traefik snippet for the proxy in front of ocapps (SPEC §9.3).
# File provider: store it as a dynamic file (for instance
# /etc/traefik/dynamic/ocapps.yml) with the directory declared in the
# static configuration (providers.file). Equivalent to
# deploy/proxy/nginx.conf and deploy/proxy/Caddyfile.
#
# ═══════════════════════════════════════════════════════════════════════
# Two details that are NOT optional:
#
# 1. Host() in the rule: without it, the /api/me and /api/users routes would
#    swallow those paths for EVERY site served by the same Traefik. Change
#    cloud.example.com to the public domain of your instance.
#
# 2. No prefix stripping: /ocphotos-api/ must reach the backend INTACT (in
#    the unified binary /api/ belongs to news and photos registers its
#    routes as /ocphotos-api/api/...). Traefik rewrites no routes by
#    default, so it is enough NOT to add a stripprefix middleware.
#
# Traefik derives priority from rule length, so this router wins over an
# equivalent Host() catch-all with no explicit priority.
# ═══════════════════════════════════════════════════════════════════════

http:
  routers:
    ocapps:
      # news: News API v1.3 contract, plus OCS and notes (capabilities,
      # cloud/user).
      # /api/me and /api/users: the extension's own API at the host ROOT
      # (settings and user management). Exact patterns: do NOT route a /api/
      # catch-all, as it would clash with any other /api/ on the host.
      rule: "Host(`cloud.example.com`) && (PathPrefix(`/index.php/apps/news/`) || PathPrefix(`/index.php/apps/notes/`) || PathPrefix(`/ocs/`) || PathPrefix(`/ocphotos-api/`) || Path(`/api/me`) || PathPrefix(`/api/me/`) || Path(`/api/users`) || PathPrefix(`/api/users/`))"
      service: ocapps

  services:
    ocapps:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8077"
        # Traefik preserves Host and EVERY header (including Authorization,
        # which carries the Basic/Bearer credentials of the News contract),
        # and adds X-Forwarded-For/Proto automatically.
        #
        # flushInterval 1ms: almost immediate flush for the signed video
        # streaming (/ocphotos-api/api/video/{id}, Range/206), the
        # equivalent of proxy_buffering off / flush_interval -1 in the
        # nginx/Caddy snippets.
        responseForwarding:
          flushInterval: 1ms
